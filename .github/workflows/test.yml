name: test
on:
  workflow_dispatch:
jobs:
  generate-python-matrix:
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.set-matrix.outputs.python_versions }}
    steps:
      - name: Generate Python versions
        id: set-matrix
        run: |
          # Example: Get Python versions from a file, or dynamically generate them
          # For demonstration, we'll use a static list
          PYTHON_VERSIONS='["3.8", "3.9", "3.10", "3.11"]'
          echo "python_versions=${PYTHON_VERSIONS}" >> $GITHUB_OUTPUT
        shell: bash
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Display Python Version
        run: python -c "import sys; print(sys.version)"
        shell: bash
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ '3.11' }}
      - name: Display Python Version
        run: python -c "import sys; print(sys.version)"
        shell: bash
      - name: Checkout STUMPY
        uses: actions/checkout@v4
        with:
          repository: stumpy-dev/stumpy
