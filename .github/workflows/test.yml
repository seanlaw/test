name: test
on:
  workflow_dispatch:
jobs:
  generate-python-matrix:
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.set-matrix.outputs.python_versions }}
    steps:
      - name: Generate Python versions
        id: set-matrix
        run: |
          # Example: Get Python versions from a file, or dynamically generate them
          # For demonstration, we'll use a static list
          PYTHON_VERSIONS='["3.10", "3.11", "3.12", "3.13"]'
          echo "python_versions=${PYTHON_VERSIONS}" >> $GITHUB_OUTPUT
        shell: bash
  test:
    needs: generate-python-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.generate-python-matrix.outputs.python_versions) }}
    steps:
      - name: Display Preinstalled (Default) Python Version
        run: python -c "import sys; print(sys.version)"
        shell: bash
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python Version
        run: python -c "import sys; print(sys.version)"
        shell: bash
      - name: Checkout STUMPY
        uses: actions/checkout@v4
        with:
          repository: stumpy-dev/stumpy
